name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 公開する既存のvX.Y.Zタグ
        required: true
        type: string

env:
  RELEASE_TAG: ${{ inputs.release_tag || github.ref_name }}

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7.0.1
        with:
          ref: ${{ env.RELEASE_TAG }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.4.2

      - uses: actions/setup-node@v7.0.0
        with:
          node-version: 22

      - name: Verify tag and package version
        run: node -e "if (process.env.RELEASE_TAG !== 'v' + require('./package.json').version) throw new Error('Release tag and package version differ')"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Lint
        run: bun run lint

      - name: Audit dependencies
        run: bun audit

      - name: Type check
        run: bun run type-check

      - name: Test
        run: bun run test

      - name: Build electron-vite
        run: bun run build

      - name: Build Windows installer
        run: bun x --no-install electron-builder --win --publish never

      - name: Extract changelog for this version
        id: changelog
        shell: bash
        run: |
          TAG="${RELEASE_TAG#v}"
          SECTION=$(awk -v tag="## [${TAG}]" '
            index($0, tag) == 1 { found = 1 }
            found && /^## \[/ && index($0, tag) != 1 { found = 0 }
            found { print }
          ' CHANGELOG.md)
          if [ -z "$SECTION" ]; then
            echo "found=false" >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<CHANGELOG_EOF"
              echo "$SECTION"
              echo "CHANGELOG_EOF"
            } >> "$GITHUB_OUTPUT"
            echo "found=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to GitHub Releases (with changelog)
        if: steps.changelog.outputs.found == 'true'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          body: ${{ steps.changelog.outputs.body }}
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases (auto notes fallback)
        if: steps.changelog.outputs.found == 'false'
        uses: softprops/action-gh-release@v3.0.3
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          generate_release_notes: true
          files: |
            dist/*.exe
            dist/*.exe.blockmap
            dist/latest.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
